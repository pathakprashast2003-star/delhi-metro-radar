<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" width="256" height="64">
  <defs>
    <!-- Sleeper Cast Shadow -->
    <filter id="sleeperShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.4" />
    </filter>

    <!-- Sleeper 3D Bevel Gradient -->
    <linearGradient id="sleeperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="15%" stop-color="#334155" />
      <stop offset="85%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Rail Steel Polish -->
    <linearGradient id="railGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Single Cross-Tie (Sleeper) Symbol -->
    <g id="tie">
      <!-- Main Sleeper Body -->
      <rect x="-6" y="6" width="12" height="52" rx="1.5" fill="url(#sleeperGrad)" filter="url(#sleeperShadow)" />
      <!-- Top Bevel Highlight Edge -->
      <line x1="-5" y1="7" x2="-5" y2="57" stroke="#64748B" stroke-width="1" />
      <!-- Tie Plate Pads at Rail Seats (Rail 1 at y=19, Rail 2 at y=45) -->
      <rect x="-5" y="16" width="10" height="6" rx="1" fill="#0F172A" />
      <rect x="-5" y="42" width="10" height="6" rx="1" fill="#0F172A" />
      <!-- Fastener clips -->
      <circle cx="-2" cy="19" r="1" fill="#D97706" />
      <circle cx="2" cy="19" r="1" fill="#D97706" />
      <circle cx="-2" cy="45" r="1" fill="#D97706" />
      <circle cx="2" cy="45" r="1" fill="#D97706" />
    </g>
  </defs>

  <!-- 1. Cross-Ties (Sleepers Layer) - Exactly 8 ties spaced every 32px -->
  <g id="sleepers">
    <use href="#tie" x="16" />
    <use href="#tie" x="48" />
    <use href="#tie" x="80" />
    <use href="#tie" x="112" />
    <use href="#tie" x="144" />
    <use href="#tie" x="176" />
    <use href="#tie" x="208" />
    <use href="#tie" x="240" />
  </g>

  <!-- 2. Twin Continuous Steel Rails (Top Layer) -->
  <!-- ── RAIL 1 (Top Running Rail at y=19) ── -->
  <!-- Outer steel flange base -->
  <line x1="0" y1="19" x2="256" y2="19" stroke="#0F172A" stroke-width="4.5" />
  <!-- Middle steel rail web -->
  <line x1="0" y1="19" x2="256" y2="19" stroke="#475569" stroke-width="2.8" />
  <!-- Pure gleaming steel crown -->
  <line x1="0" y1="19" x2="256" y2="19" stroke="url(#railGleam)" stroke-width="1.4" />

  <!-- ── RAIL 2 (Bottom Running Rail at y=45) ── -->
  <!-- Outer steel flange base -->
  <line x1="0" y1="45" x2="256" y2="45" stroke="#0F172A" stroke-width="4.5" />
  <!-- Middle steel rail web -->
  <line x1="0" y1="45" x2="256" y2="45" stroke="#475569" stroke-width="2.8" />
  <!-- Pure gleaming steel crown -->
  <line x1="0" y1="45" x2="256" y2="45" stroke="url(#railGleam)" stroke-width="1.4" />
</svg>